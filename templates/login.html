{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Marauder</h1>
        <h2>Connexion</h2>
        <form method="POST">
            <div class="form-group">
                <label>Pseudo</label>
                <input type="text" name="username" class="input" placeholder="votre_pseudo" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" class="input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>
        <p class="auth-link">Pas encore de compte ? <a href="{{ url_for('register') }}">S'inscrire</a></p>
    </div>
</div>
{% endblock %}
