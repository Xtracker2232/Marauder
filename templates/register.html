<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Marauder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
        }

        .card {
            background: #141414;
            border-radius: 16px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
        }

        .card h2 {
            font-size: 15px;
            font-weight: 400;
            color: #666;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .input:focus {
            border-color: #fff;
        }

        .input::placeholder {
            color: #444;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .auth-link a {
            color: #fff;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #333;
        }

        .footer-text strong {
            color: #555;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-success {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .alert-error {
            background: rgba(255, 0, 0, 0.05);
            color: #ff4444;
            border: 1px solid rgba(255, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">

            <h1>Inscription</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label>Pseudo</label>
                    <input type="text" name="username" class="input" placeholder="votre_pseudo" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="password" class="input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">S'inscrire</button>
            </form>

            <p class="auth-link">
                Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
            </p>

        </div>

        <div class="footer-text">
            Marauder &middot; 2025 &middot; creat by <strong>@index</strong>
        </div>
    </div>

</body>
</html>
