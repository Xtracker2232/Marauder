<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marauder - Moteur de recherche avancé</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- BADGE EN HAUT -->
    <div class="badge-container">
        <span class="badge">🇫🇷 Base française · 11 milliards d'entrées</span>
    </div>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">

            <h1 class="hero-title">Marauder</h1>

            <div class="hero-text-container">
                <p class="hero-text" id="animated-text"></p>
            </div>

            <div class="hero-buttons">
                <a href="/login" class="btn-hero">Commencez gratuitement</a>
                <a href="#" class="btn-discord" id="discord-btn">Discord</a>
            </div>

        </div>
    </section>

    <script>
        // ─── ANIMATION TEXTE ──────────────────────────
        const phrases = [
            "Plus de 11 milliards d'entrées",
            "Outil CSINT avancé",
            "Recherche en moins de 30ms",
            "Données en temps réel",
            "100% sécurisé"
        ];

        let index = 0;
        let charIndex = 0;
        let isDeleting = false;
        const textElement = document.getElementById('animated-text');

        function typeEffect() {
            const currentPhrase = phrases[index];
            
            if (isDeleting) {
                textElement.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                textElement.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            let speed = isDeleting ? 30 : 60;

            if (!isDeleting && charIndex === currentPhrase.length) {
                speed = 1500;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                index = (index + 1) % phrases.length;
                speed = 500;
            }

            setTimeout(typeEffect, speed);
        }

        // Lancer l'animation
        typeEffect();

        // ─── BOUTON DISCORD ──────────────────────────
        document.getElementById('discord-btn').addEventListener('click', function(e) {
            e.preventDefault();
            // À remplacer par le vrai lien Discord plus tard
            window.open('https://discord.gg/ton-lien', '_blank');
        });
    </script>

</body>
</html>
