{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="dashboard-container">

    <!-- NAVBAR -->
    <nav class="dash-nav">
        <div class="dash-nav-left">
            <a href="/dashboard" class="dash-nav-brand">Marauder</a>
        </div>
        <div class="dash-nav-center">
            <a href="/dashboard" class="dash-nav-link active">🔍 Recherche</a>
            <a href="#" class="dash-nav-link">📊 Graphe</a>
            <a href="#" class="dash-nav-link">📜 Historique</a>
        </div>
        <div class="dash-nav-right">
            <a href="#" class="dash-nav-link">👤 {{ user.username }}</a>
            <a href="/logout" class="btn btn-outline btn-sm">Déconnexion</a>
        </div>
    </nav>

    <!-- TITRE -->
    <div class="dash-header">
        <h1 class="dash-title">Recherche</h1>
        <div class="dash-tabs">
            <button class="dash-tab active">Recherche</button>
            <button class="dash-tab">Recherche française</button>
            <button class="dash-tab">Email & Mot de passe</button>
            <button class="dash-tab">Recherche Pro</button>
        </div>
    </div>

    <!-- PANEL DE RECHERCHE -->
    <form method="POST" action="{{ url_for('search') }}" class="search-panel">

        <!-- SECTION IDENTITÉ -->
        <div class="search-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span class="section-title">Identité</span>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-body">
                <div class="search-grid">
                    <div class="search-group">
                        <label>Nom</label>
                        <input type="text" name="nom" class="input" placeholder="Dupont">
                    </div>
                    <div class="search-group">
                        <label>Prénom</label>
                        <input type="text" name="prenom" class="input" placeholder="Jean">
                    </div>
                    <div class="search-group">
                        <label>Nom de naissance</label>
                        <input type="text" name="nom_naissance" class="input" placeholder="Martin">
                    </div>
                    <div class="search-group">
                        <label>Nom affiché</label>
                        <input type="text" name="nom_affichage" class="input" placeholder="Jean Dupont">
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION NAISSANCE -->
        <div class="search-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span class="section-title">Naissance</span>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-body">
                <div class="search-grid">
                    <div class="search-group">
                        <label>Jour</label>
                        <input type="number" name="jour" class="input" placeholder="15">
                    </div>
                    <div class="search-group">
                        <label>Mois</label>
                        <input type="number" name="mois" class="input" placeholder="6">
                    </div>
                    <div class="search-group">
                        <label>Année</label>
                        <input type="number" name="annee" class="input" placeholder="1990">
                    </div>
                    <div class="search-group">
                        <label>Date exacte</label>
                        <input type="date" name="date_naissance" class="input" value="1990-06-15">
                    </div>
                    <div class="search-group">
                        <label>Ville de naissance</label>
                        <input type="text" name="ville_naissance" class="input" placeholder="Paris">
                    </div>
                    <div class="search-group">
                        <label>Genre</label>
                        <select name="genre" class="input">
                            <option value="">Tous</option>
                            <option value="M">Masculin</option>
                            <option value="F">Féminin</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION CONTACT -->
        <div class="search-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span class="section-title">Contact</span>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-body">
                <div class="search-grid">
                    <div class="search-group">
                        <label>Email</label>
                        <input type="email" name="email" class="input" placeholder="jean@example.com">
                    </div>
                    <div class="search-group">
                        <label>Téléphone</label>
                        <input type="tel" name="telephone" class="input" placeholder="0612345678">
                    </div>
                    <div class="search-group">
                        <label>Nom d'utilisateur</label>
                        <input type="text" name="nom_utilisateur" class="input" placeholder="jean_d">
                    </div>
                    <div class="search-group">
                        <label>Adresse IP</label>
                        <input type="text" name="adresse_ip" class="input" placeholder="192.168.1.1">
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION LOCALISATION -->
        <div class="search-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span class="section-title">Localisation</span>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-body">
                <div class="search-grid">
                    <div class="search-group">
                        <label>Adresse</label>
                        <input type="text" name="adresse" class="input" placeholder="10 rue de la Paix">
                    </div>
                    <div class="search-group">
                        <label>Code postal</label>
                        <input type="text" name="code_postal" class="input" placeholder="75001">
                    </div>
                    <div class="search-group">
                        <label>Ville</label>
                        <input type="text" name="ville" class="input" placeholder="Paris">
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION FIVEM / GTA RP -->
        <div class="search-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span class="section-title">FiveM / GTA RP</span>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-body">
                <div class="search-grid">
                    <div class="search-group">
                        <label>Steam ID</label>
                        <input type="text" name="steam_id" class="input" placeholder="steam:110000123456789">
                    </div>
                    <div class="search-group">
                        <label>FiveM License</label>
                        <input type="text" name="fivem_license" class="input" placeholder="license:abc123...">
                    </div>
                    <div class="search-group">
                        <label>Discord ID</label>
                        <input type="text" name="discord_id" class="input" placeholder="834855528869265459">
                    </div>
                    <div class="search-group">
                        <label>Xbox Live (XBL)</label>
                        <input type="text" name="xbox_live_id" class="input" placeholder="xbl:2535423154...">
                    </div>
                    <div class="search-group">
                        <label>Live ID</label>
                        <input type="text" name="live_id" class="input" placeholder="live:844425868261">
                    </div>
                    <div class="search-group">
                        <label>FiveM License2</label>
                        <input type="text" name="fivem_license2" class="input" placeholder="license2:def456...">
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION CHAMPS AVANCÉS -->
        <div class="search-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span class="section-title">Champs avancés</span>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-body">
                <div class="search-grid">
                    <div class="search-group">
                        <label>NIR (Sécu)</label>
                        <input type="text" name="nir" class="input" placeholder="1234567890123">
                    </div>
                    <div class="search-group">
                        <label>IBAN</label>
                        <input type="text" name="iban" class="input" placeholder="FR76...">
                    </div>
                    <div class="search-group">
                        <label>BIC</label>
                        <input type="text" name="bic" class="input" placeholder="BNPAFRPP">
                    </div>
                    <div class="search-group">
                        <label>VIN / Plaque</label>
                        <input type="text" name="vin_plaque" class="input" placeholder="AB-123-CD">
                    </div>
                </div>
            </div>
        </div>

        <!-- BOUTONS -->
        <div class="search-actions">
            <button type="submit" class="btn btn-primary">Rechercher</button>
            <button type="reset" class="btn btn-outline">Effacer</button>
        </div>

    </form>

</div>

<script>
function toggleSection(header) {
    const body = header.nextElementSibling;
    const toggle = header.querySelector('.section-toggle');
    if (body.style.display === 'none' || body.style.display === '') {
        body.style.display = 'block';
        toggle.textContent = '▼';
    } else {
        body.style.display = 'none';
        toggle.textContent = '▶';
    }
}

// Ouvrir toutes les sections par défaut
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.section-body').forEach(el => {
        el.style.display = 'block';
    });
});
</script>

{% endblock %}
