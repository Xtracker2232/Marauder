<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Marauder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 16px;
            width: 360px;
            border: 1px solid #2a2a2a;
            text-align: center;
        }
        h1 { margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 24px; }
        .info { background: #0a0a0a; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: left; }
        .info strong { color: #888; }
        .info span { color: #fff; }
        a {
            display: block;
            padding: 12px;
            background: #333;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 8px;
        }
        a:hover { background: #444; }
        .footer { text-align: center; margin-top: 20px; font-size: 13px; color: #333; }
        .footer strong { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>👋 Bonjour, {{ user.username }}</h1>
        <p class="subtitle">Bienvenue sur votre espace Marauder</p>

        <div class="info">
            <strong>ID :</strong> <span>#{{ user.id }}</span>
        </div>
        <div class="info">
            <strong>Pseudo :</strong> <span>{{ user.username }}</span>
        </div>

        <a href="/logout">Déconnexion</a>

        <div class="footer">
            Marauder &middot; 2025 &middot; creat by <strong>@index</strong>
        </div>
    </div>
</body>
</html>
